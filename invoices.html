<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rechnungen – BOT PAPA CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050816; --bg-card: #0d1428; --bg-input: #0a1230;
      --accent: #00e0ff; --accent-soft: rgba(0,224,255,0.08);
      --text: #f5f7ff; --muted: #a3aac2; --danger: #ff4757; --success: #00c896;
      --border: rgba(255,255,255,0.07); --border-accent: rgba(0,224,255,0.2);
      --radius: 12px; --radius-sm: 8px;
      --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.6; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    nav { position: sticky; top: 0; z-index: 100; background: rgba(5,8,22,0.95); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 0 5vw; display: flex; align-items: center; justify-content: space-between; height: 60px; }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-brand-icon { width: 32px; height: 32px; background: var(--accent-soft); border: 1px solid var(--border-accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .nav-brand-text { font-family: var(--font-head); font-weight: 800; font-size: 15px; color: var(--text); }
    .nav-brand-text span { color: var(--accent); }
    .nav-links { display: flex; gap: 4px; list-style: none; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; transition: all 0.2s; }
    .nav-links a:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .nav-links a.active { color: var(--accent); background: var(--accent-soft); }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .user-badge { font-size: 12px; color: var(--muted); background: var(--accent-soft); border: 1px solid var(--border-accent); padding: 4px 10px; border-radius: 999px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-badge span { color: var(--accent); font-weight: 600; }
    .btn-logout { background: rgba(255,71,87,0.12); border: 1px solid rgba(255,71,87,0.25); color: var(--danger); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .btn-logout:hover { background: rgba(255,71,87,0.2); }

    main { max-width: 1200px; margin: 0 auto; padding: 32px 5vw 60px; }
    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-family: var(--font-head); font-size: 24px; font-weight: 800; }
    .page-header p { color: var(--muted); font-size: 14px; margin-top: 4px; }

    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .card-title { font-family: var(--font-head); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .card-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-group label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .form-group input, .form-group select { background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-body); font-size: 14px; padding: 10px 14px; outline: none; transition: border-color 0.2s; width: 100%; }
    .form-group input:focus, .form-group select:focus { border-color: var(--border-accent); }
    .form-group input::placeholder { color: rgba(163,170,194,0.4); }
    .form-group select option { background: var(--bg-card); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border-radius: 8px; font-family: var(--font-head); font-size: 13px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; width: 100%; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #00b8d4); color: #050816; }
    .btn-primary:hover { opacity: 0.88; }

    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
    tbody td { padding: 14px; border-bottom: 1px solid var(--border); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,0.02); }
    td small { color: var(--muted); font-size: 12px; display: block; }
    .tag { display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .tag-success { background: rgba(0,200,150,0.12); color: var(--success); border: 1px solid rgba(0,200,150,0.2); }
    .tag-danger { background: rgba(255,71,87,0.12); color: var(--danger); border: 1px solid rgba(255,71,87,0.2); }
    .empty-state { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

    footer { border-top: 1px solid var(--border); padding: 20px 5vw; text-align: center; color: var(--muted); font-size: 12px; }
    @media (max-width: 768px) { .nav-links { display: none; } }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">
    <div class="nav-brand-icon">🤖</div>
    <span class="nav-brand-text">BOT <span>PAPA</span> CRM</span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Dashboard</a></li>
    <li><a href="clients.html">Kunden</a></li>
    <li><a href="projects.html">Projekte</a></li>
    <li><a href="invoices.html" class="active">Rechnungen</a></li>
  </ul>
  <div class="nav-right">
    <div class="user-badge" id="userInfo">Prüfe Login…</div>
    <button id="logoutBtn" class="btn-logout">Logout</button>
  </div>
</nav>

<main>
  <div class="page-header">
    <h1>Rechnungen</h1>
    <p>Rechnungen erstellen, Beträge tracken und Status verwalten.</p>
  </div>

  <div class="layout">
    <div class="card">
      <div class="card-title">Neue Rechnung</div>
      <form id="invoiceForm">
        <div class="form-group">
          <label for="invoiceNumber">Rechnungsnummer *</label>
          <input type="text" id="invoiceNumber" placeholder="RE-2026-001" required />
        </div>
        <div class="form-group">
          <label for="invoiceProject">Projekt *</label>
          <select id="invoiceProject" required>
            <option value="" disabled selected>Lade Projektdaten…</option>
          </select>
        </div>
        <div class="form-group">
          <label for="invoiceAmount">Betrag (€) *</label>
          <input type="number" step="0.01" id="invoiceAmount" placeholder="0.00" required />
        </div>
        <div class="form-group">
          <label for="invoiceStatus">Status</label>
          <select id="invoiceStatus">
            <option value="offen" selected>Offen</option>
            <option value="bezahlt">Bezahlt</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Rechnung speichern →</button>
      </form>
    </div>

    <div class="card">
      <div class="card-title">Rechnungsübersicht</div>
      <div class="table-container">
        <table>
          <thead>
            <tr><th>Nr.</th><th>Projekt / Kunde</th><th>Betrag</th><th>Status</th><th>Datum</th></tr>
          </thead>
          <tbody id="invoiceTableBody">
            <tr><td colspan="5" class="empty-state">Lade Rechnungen…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<footer>© 2026 BOT PAPA – crm.bot-papa.online</footer>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL = 'https://javbfzuekkmewbzowchj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphdmJmenVla2ttZXdiem93Y2hqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1Mzc4MzcsImV4cCI6MjA5NjExMzgzN30.p3O49RvkmsullvMZ1atfDKWMuu8XyBSgE3q86pyDAxY';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentUserId = null;

  async function checkAuthAndLoad() {
    const { data, error } = await supabase.auth.getSession();
    if (error || !data?.session) { window.location.href = 'login.html'; return; }
    currentUserId = data.session.user.id;
    document.getElementById('userInfo').innerHTML = '<span>' + data.session.user.email + '</span>';
    await loadProjekteDropdown();
    await loadRechnungen();
  }

  async function loadProjekteDropdown() {
    const select = document.getElementById('invoiceProject');
    const { data: projects, error } = await supabase.from('projects').select('id, title').order('title', { ascending: true });
    if (error) { select.innerHTML = '<option value="" disabled selected>❌ Fehler beim Laden</option>'; return; }
    if (!projects?.length) { select.innerHTML = '<option value="" disabled selected>⚠️ Erst Projekte anlegen!</option>'; return; }
    select.innerHTML = '<option value="" disabled selected>Bitte Projekt auswählen…</option>';
    projects.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.title; select.appendChild(o); });
  }

  async function loadRechnungen() {
    const tbody = document.getElementById('invoiceTableBody');
    const { data: invoices, error } = await supabase.from('invoices').select('*').order('created_at', { ascending: false });
    const { data: projects } = await supabase.from('projects').select('id, title, client_id');
    const { data: clients } = await supabase.from('clients').select('id, name');
    if (error) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state" style="color:var(--danger)">Fehler beim Laden</td></tr>'; return; }
    if (!invoices?.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Noch keine Rechnungen hinterlegt.</td></tr>'; return; }
    tbody.innerHTML = '';
    invoices.forEach(i => {
      const tr = document.createElement('tr');
      const project = projects?.find(p => p.id === i.project_id);
      const client = clients?.find(c => c.id === project?.client_id);
      const tagClass = i.status === 'bezahlt' ? 'tag-success' : 'tag-danger';
      const tagText = i.status === 'bezahlt' ? 'Bezahlt' : 'Offen';
      const dateStr = i.created_at ? new Date(i.created_at).toLocaleDateString('de-DE') : '—';
      tr.innerHTML = `
        <td><strong>${i.invoice_number || '—'}</strong></td>
        <td>${project?.title || '—'}<small>${client?.name || '—'}</small></td>
        <td><strong>${parseFloat(i.amount || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' })}</strong></td>
        <td><span class="tag ${tagClass}">${tagText}</span></td>
        <td><small>${dateStr}</small></td>`;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const projectId = document.getElementById('invoiceProject').value;
    if (!projectId) { alert('Bitte wähle ein Projekt aus.'); return; }
    const { error } = await supabase.from('invoices').insert([{
      user_id: currentUserId,
      invoice_number: document.getElementById('invoiceNumber').value.trim(),
      project_id: projectId,
      amount: parseFloat(document.getElementById('invoiceAmount').value),
      status: document.getElementById('invoiceStatus').value
    }]);
    if (error) { alert('Fehler: ' + error.message); }
    else { document.getElementById('invoiceForm').reset(); loadProjekteDropdown(); loadRechnungen(); }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut(); window.location.href = 'login.html';
  });

  checkAuthAndLoad();
</script>
</body>
</html>
