<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Bot Papa Freelancer CRM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .login-card {
      background: #fff;
      padding: 2rem 2rem 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
    }
    .login-card h1 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.6rem 0.7rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: #222;
    }
    .btn {
      width: 100%;
      padding: 0.7rem;
      border: none;
      border-radius: 4px;
      background: #222;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn:hover {
      background: #333;
    }
    .back-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
    }
    .back-link a {
      color: #444;
      text-decoration: none;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
    .error-msg {
      color: #b00020;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
      text-align: center;
      display: none;
    }
    .info-msg {
      color: #007b3a;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Login – Bot Papa Freelancer CRM</h1>
    <div class="error-msg" id="errorMsg"></div>
    <div class="info-msg" id="infoMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-Mail</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn">Einloggen</button>
    </form>
    <div class="back-link">
      <a href="../index.html">Zurück zur Startseite</a>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // >>> HIER DEINE SUPABASE-DATEN EINTRAGEN <<<
    // Project URL aus Supabase: Settings -> API -> Project URL
    const SUPABASE_URL = 'https://javbfzuekkmewbzowchj.supabase.co';

    // anon public key aus Supabase: Settings -> API -> anon public
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphdmJmenVla2ttZXdiem93Y2hqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1Mzc4MzcsImV4cCI6MjA5NjExMzgzN30.p3O49RvkmsullvMZ1atfDKWMuu8XyBSgE3q86pyDAxY';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const infoMsg = document.getElementById('infoMsg');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      errorMsg.textContent = '';
      infoMsg.style.display = 'none';
      infoMsg.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        errorMsg.textContent = 'Bitte E-Mail und Passwort angeben.';
        errorMsg.style.display = 'block';
        return;
      }

      infoMsg.textContent = 'Anmeldung läuft...';
      infoMsg.style.display = 'block';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          console.error(error);
          infoMsg.style.display = 'none';
          errorMsg.textContent = 'Login fehlgeschlagen: ' + (error.message || 'Unbekannter Fehler.');
          errorMsg.style.display = 'block';
          return;
        }

        infoMsg.textContent = 'Login erfolgreich. Weiterleitung...';
        setTimeout(() => {
          window.location.href = '../index.html';
        }, 800);

      } catch (err) {
        console.error(err);
        infoMsg.style.display = 'none';
        errorMsg.textContent = 'Es ist ein Fehler aufgetreten. Bitte später erneut versuchen.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
