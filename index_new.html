<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Papa Freelancer CRM – Dashboard</title>
  <style>
    :root {
      --bg-main: #050816;
      --bg-card: rgba(8, 13, 34, 0.95);
      --header-top: #16161a;
      --header-nav: #232329;
      --accent: #00e0ff;
      --text: #f5f7ff;
      --muted: #a3aac2;
      --border: 1px solid rgba(255, 255, 255, 0.08);
      --success: #28a745;
      --success-bg: #218838;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #101735 0, var(--bg-main) 60%, #02030a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Header Bar */
    .header-top-bar {
      background: var(--header-top);
      border-bottom: var(--border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .crm-brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-area {
      font-size: 14px;
      color: var(--text);
    }

    .status-badge {
      background: #2ea44f;
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-left: 6px;
      display: inline-block;
    }

    /* Nav Bar */
    .header-nav-bar {
      background: var(--header-nav);
      border-bottom: var(--border);
      padding: 10px 20px;
      display: flex;
      gap: 20px;
    }

    .header-nav-bar a {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }

    .header-nav-bar a.logout-btn {
      color: #ff4a4a;
    }

    /* Main Content Grid */
    .main-container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px;
      flex: 1;
    }

    .dashboard-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .dashboard-box {
      flex: 1;
      min-width: 240px;
      background: var(--bg-card);
      border: var(--border);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .box-label {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .box-value {
      font-size: 32px;
      font-weight: 700;
    }

    .dashboard-box:nth-child(1) .box-value { color: var(--text); }
    .dashboard-box:nth-child(2) .box-value { color: #ff9f43; } /* Offener Betrag */

    footer {
      text-align: center;
      padding: 30px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="header-top-bar">
    <div class="crm-brand">Bot Papa Freelancer CRM – Dashboard</div>
    <div class="status-area">Status: bodo@bot-papa.online <span class="status-badge">eingeloggt</span></div>
  </div>

  <div class="header-nav-bar">
    <a href="index.html">Dashboard</a>
    <a href="clients.html">Kunden</a>
    <a href="projects.html">Projekte</a>
    <a href="invoices.html">Rechnungen</a>
    <a href="logout.html" class="logout-btn">Logout</a>
  </div>

  <div class="main-container">
    <div class="dashboard-grid">
      <div class="dashboard-box">
        <div class="box-label">Umsatz (Bezahlt)</div>
        <div class="box-value">3.978,63 €</div>
      </div>
      <div class="dashboard-box">
        <div class="box-label">Offene Beträge</div>
        <div class="box-value">1.032,85 €</div>
      </div>
      <div class="dashboard-box">
        <div class="box-label">Aktive Projekte</div>
        <div class="box-value">3</div>
      </div>
      <div class="dashboard-box">
        <div class="box-label">Kunden</div>
        <div class="box-value">3</div>
      </div>
    </div>
  </div>

  <footer>© 2026 Bot Papa – Freelancer CRM</footer>

</body>
</html>
